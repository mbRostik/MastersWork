version: '3.6'

services:
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - 27017:27017

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:8.7.1
    ports: 
      - 5601:5601
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    networks:
      - elastic

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: false

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
    entrypoint: ["/bin/sh", "-ec", "test -n \"$$RABBITMQ_DEFAULT_USER\" && test -n \"$$RABBITMQ_DEFAULT_PASS\" || { echo 'Set RABBITMQ_USER and RABBITMQ_PASSWORD' >&2; exit 1; }; exec docker-entrypoint.sh rabbitmq-server"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  # --- NEW SERVICES BELOW ---

  clickhouse:
    container_name: clickhouse
    image: clickhouse/clickhouse-server:latest
    restart: always
    ports:
      - "127.0.0.1:${CLICKHOUSE_PORT:-9000}:9000"
      - "127.0.0.1:8123:8123"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics_db}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    entrypoint: ["/bin/sh", "-ec", "test -n \"$$CLICKHOUSE_USER\" && test -n \"$$CLICKHOUSE_PASSWORD\" || { echo 'Set CLICKHOUSE_USER and CLICKHOUSE_PASSWORD' >&2; exit 1; }; exec /entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource # Auto-installs ClickHouse plugin
    entrypoint: ["/bin/sh", "-ec", "test -n \"$$GF_SECURITY_ADMIN_PASSWORD\" || { echo 'Set GF_SECURITY_ADMIN_PASSWORD' >&2; exit 1; }; exec /run.sh"]
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - clickhouse

networks:
  elastic:
    driver: bridge

volumes:
  elasticsearch-data:
  clickhouse_data: # Persists ClickHouse data
  grafana_data:    # Persists Grafana dashboards and settings
