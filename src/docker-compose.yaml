version: '3.6'

services:
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - 27017:27017

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:8.7.1
    ports: 
      - 5601:5601
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    networks:
      - elastic

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: false

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"

  # --- NEW SERVICES BELOW ---

  clickhouse:
    container_name: clickhouse
    image: clickhouse/clickhouse-server:latest
    restart: always
    ports:
      - "8123:8123" # HTTP interface (Used by Grafana)
      - "9000:9000" # Native interface (Used by ClickHouse client)
    environment:
      - CLICKHOUSE_DB=analytics_db      # Creates this DB on startup
      - CLICKHOUSE_USER=grafana_user    # Creates this user
      - CLICKHOUSE_PASSWORD=securepass  # Sets the user's password
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource # Auto-installs ClickHouse plugin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - clickhouse

networks:
  elastic:
    driver: bridge

volumes:
  elasticsearch-data:
  clickhouse_data: # Persists ClickHouse data
  grafana_data:    # Persists Grafana dashboards and settings